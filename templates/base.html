<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CLPTrack{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand bg-white border-bottom mb-4">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="{% url 'home' %}">CLPTrack</a>
    {% if user.is_authenticated %}
    <div class="d-flex align-items-center gap-3">
      <span class="text-secondary small">{{ user.get_full_name|default:user.username }}, {{ user.get_role_display }}</span>
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}
        <button class="btn btn-outline-secondary btn-sm">Sign out</button>
      </form>
    </div>
    {% endif %}
  </div>
</nav>
<main class="container">
  {% block content %}{% endblock %}
</main>
</body>
</html>
